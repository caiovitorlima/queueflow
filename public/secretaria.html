<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QueueFlow - Secretaria</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container secretaria-container">
    <h1>Secretaria</h1>

    <section id="areaLogin">
      <p>Digite o token de acesso da secretaria.</p>

      <input
        type="password"
        id="token"
        placeholder="Token de acesso"
      >

      <button id="botaoEntrar">
        Entrar
      </button>

      <p id="erroLogin"></p>
    </section>

    <section id="painelSecretaria" class="oculto">
      <div class="acoes-secretaria">
        <button id="botaoChamar">
          Chamar próximo
        </button>

        <button id="botaoFinalizar">
          Finalizar atendimento
        </button>

        <button id="botaoSair">
          Sair
        </button>
      </div>

      <p id="mensagemSecretaria"></p>

      <h2>Fila</h2>
      <div id="listaFila"></div>

      <h2>Histórico</h2>
      <div id="listaHistorico"></div>
    </section>
  </main>

  <script src="secretaria.js"></script>
</body>
</html>
